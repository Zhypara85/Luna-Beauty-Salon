name: Luna Beauty Salon CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # Step 1: Download source code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Verify important application files exist
      - name: Validate application files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f Dockerfile
          echo "Application files validated successfully"

      # Step 3: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t luna-beauty-salon:${{ github.sha }} .

      # Step 4: Verify Docker image was created
      - name: Verify Docker image
        run: |
          docker images
          docker image inspect luna-beauty-salon:${{ github.sha }}

      # Step 5: Run container
      - name: Run Docker container
        run: |
          docker run -d \
            --name luna-salon \
            -p 8080:80 \
            luna-beauty-salon:${{ github.sha }}

      # Step 6: Test website
      - name: Test application
        run: |
          sleep 3
          curl --fail http://localhost:8080

      # Step 7: Show running containers
      - name: Verify container
        run: |
          docker ps
